<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#eef1f6; color:#1f2733; padding:20px; }
  h1 { margin:0 0 16px; font-size:1.5rem; }
  .board { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; max-width:1100px; margin:0 auto; }
  .col { background:#e2e8f0; border-radius:12px; padding:12px; display:flex; flex-direction:column; min-height:200px; }
  .col h2 { margin:0 0 10px; font-size:.95rem; text-transform:uppercase; letter-spacing:.5px; color:#475569; display:flex; justify-content:space-between; }
  .col h2 .n { background:#cbd5e1; border-radius:999px; padding:1px 9px; font-size:.8rem; }
  .cards { flex:1; display:flex; flex-direction:column; gap:8px; min-height:40px; }
  .card { background:#fff; border-radius:8px; padding:10px 12px; box-shadow:0 1px 3px rgba(0,0,0,.1); cursor:grab; }
  .card.dragging { opacity:.4; }
  .card .title { display:block; margin-bottom:6px; }
  .card .pills { display:flex; gap:6px; flex-wrap:wrap; }
  .pill { font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:999px; }
  .pill.Low { background:#dcfce7; color:#166534; }
  .pill.Medium { background:#fef9c3; color:#854d0e; }
  .pill.High { background:#fee2e2; color:#991b1b; }
  .pill.due { background:#e0e7ff; color:#3730a3; }
  .pill.due.overdue { background:#fecaca; color:#991b1b; }
  .cards.over { outline:2px dashed #94a3b8; outline-offset:2px; border-radius:8px; }
  input.add { width:100%; padding:9px 10px; border:1.5px solid #cbd5e1; border-radius:8px; margin-top:10px; font:inherit; background:#fff; }
  .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; }
  .backdrop.show { display:flex; }
  .modal { background:#fff; border-radius:12px; padding:22px; width:100%; max-width:420px; }
  .modal h3 { margin:0 0 14px; }
  .modal label { font-size:.8rem; font-weight:600; color:#5b6675; display:block; margin:10px 0 4px; }
  .modal input, .modal select { width:100%; padding:9px 11px; border:1.5px solid #cbd5e1; border-radius:8px; font:inherit; }
  .modal .actions { display:flex; gap:10px; margin-top:18px; }
  .modal button { flex:1; border:none; border-radius:8px; padding:10px; font-weight:700; cursor:pointer; }
  .modal .save { background:#2563eb; color:#fff; }
  .modal .del { background:#fee2e2; color:#991b1b; }
  @media (max-width:760px){ .board{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div style="max-width:1100px; margin:0 auto 14px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
  <h1 style="margin:0;">📋 Kanban Board</h1>
  <span id="doneToday" style="background:#dcfce7; color:#166534; font-weight:700; padding:6px 12px; border-radius:999px; font-size:.9rem;">✅ 0 done today</span>
  <button id="clearBtn" style="margin-left:auto; background:#334155; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer;">🧹 Clear completed (7d+)</button>
  <button id="histBtn" style="background:#e2e8f0; color:#334155; border:none; border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer;">🗄 History</button>
</div>
<div class="board" id="board"></div>

<div class="backdrop" id="backdrop">
  <div class="modal">
    <h3>Edit card</h3>
    <label>Title</label>
    <input id="mTitle">
    <label>Due date</label>
    <input id="mDue" type="date">
    <label>Priority</label>
    <select id="mPriority"><option>Low</option><option>Medium</option><option>High</option></select>
    <div class="actions">
      <button class="del" id="mDelete">Delete</button>
      <button class="save" id="mSave">Save</button>
    </div>
  </div>
</div>

<div class="backdrop" id="histBackdrop">
  <div class="modal" style="max-width:520px; max-height:80vh; overflow:auto;">
    <h3>🗄 Archived cards</h3>
    <div id="histList"></div>
    <div class="actions"><button class="save" id="histClose" style="background:#334155;">Close</button></div>
  </div>
</div>

<script>
const KEY = 'kanban.v1';
const COLUMNS = ['To Do','In Progress','Done'];
let cards = load();

function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(cards)); }
const esc = s => (''+s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now()+''+Math.random().toString(36).slice(2,6);

const board = document.getElementById('board');

function render() {
  board.innerHTML = COLUMNS.map(col => {
    const list = cards.filter(c => c.column === col);
    return `<div class="col">
      <h2>${col} <span class="n">${list.length}</span></h2>
      <div class="cards" data-col="${col}">
        ${list.map(c => cardHtml(c)).join('')}
      </div>
      <input class="add" data-col="${col}" placeholder="+ Add card…">
    </div>`;
  }).join('');
  wire();
}

function cardHtml(c) {
  const pills = [];
  if (c.due) {
    const overdue = c.column !== 'Done' && c.due < new Date().toISOString().slice(0,10);
    pills.push(`<span class="pill due ${overdue?'overdue':''}">📅 ${fmtDue(c.due)}</span>`);
  }
  if (c.priority) pills.push(`<span class="pill ${c.priority}">${c.priority}</span>`);
  return `<div class="card" draggable="true" data-id="${c.id}">
    <span class="title">${esc(c.title)}</span>
    ${pills.length ? `<div class="pills">${pills.join('')}</div>` : ''}
  </div>`;
}
function fmtDue(d){ return new Date(d+'T00:00').toLocaleDateString([], {month:'short', day:'numeric'}); }

function wire() {
  document.querySelectorAll('input.add').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter' && inp.value.trim()) {
        cards.push({ id: uid(), title: inp.value.trim(), column: inp.dataset.col, priority: 'Medium', due: '' });
        save(); render();
      }
    });
  });

  let dragId = null, dragged = false;
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('dragstart', () => { dragId = card.dataset.id; dragged = true; card.classList.add('dragging'); });
    card.addEventListener('dragend', () => { card.classList.remove('dragging'); setTimeout(()=>dragged=false, 0); });
    card.addEventListener('click', () => { if (!dragged) openEdit(card.dataset.id); });
  });
  document.querySelectorAll('.cards').forEach(zone => {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('over');
      const c = cards.find(x => x.id === dragId);
      if (c) {
        const newCol = zone.dataset.col;
        if (newCol === 'Done' && c.column !== 'Done') c.doneAt = Date.now();
        if (newCol !== 'Done') c.doneAt = null;
        c.column = newCol; save(); render();
      }
    });
  });
}

// ---- Edit modal ----
let editId = null;
const backdrop = document.getElementById('backdrop');
function openEdit(id) {
  const c = cards.find(x => x.id === id); if (!c) return;
  editId = id;
  document.getElementById('mTitle').value = c.title;
  document.getElementById('mDue').value = c.due || '';
  document.getElementById('mPriority').value = c.priority || 'Medium';
  backdrop.classList.add('show');
}
function closeEdit(){ backdrop.classList.remove('show'); editId = null; }
document.getElementById('mSave').onclick = () => {
  const c = cards.find(x => x.id === editId); if (!c) return;
  c.title = document.getElementById('mTitle').value.trim() || c.title;
  c.due = document.getElementById('mDue').value;
  c.priority = document.getElementById('mPriority').value;
  save(); closeEdit(); render();
};
document.getElementById('mDelete').onclick = () => {
  cards = cards.filter(x => x.id !== editId);
  save(); closeEdit(); render();
};
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeEdit(); });

// ---- Done-today counter, clear-completed, history ----
const ARCH_KEY = 'kanban.archive';
function loadArchive(){ try { return JSON.parse(localStorage.getItem(ARCH_KEY)) || []; } catch { return []; } }
function saveArchive(a){ localStorage.setItem(ARCH_KEY, JSON.stringify(a)); }

function isToday(ts){ return ts && new Date(ts).toDateString() === new Date().toDateString(); }

function updateDoneToday() {
  const onBoard = cards.filter(c => c.column === 'Done' && isToday(c.doneAt)).length;
  const archived = loadArchive().filter(c => isToday(c.doneAt)).length;
  const n = onBoard + archived;
  document.getElementById('doneToday').textContent = `✅ ${n} done today`;
}

document.getElementById('clearBtn').onclick = () => {
  const weekAgo = Date.now() - 7*24*60*60*1000;
  const toArchive = cards.filter(c => c.column === 'Done' && c.doneAt && c.doneAt < weekAgo);
  if (!toArchive.length) { alert('No Done cards older than 7 days to clear.'); return; }
  const arch = loadArchive();
  toArchive.forEach(c => arch.unshift({ ...c, archivedAt: Date.now() }));
  saveArchive(arch);
  cards = cards.filter(c => !toArchive.includes(c));
  save(); render();
  alert(`Archived ${toArchive.length} completed card${toArchive.length>1?'s':''}.`);
};

const histBackdrop = document.getElementById('histBackdrop');
document.getElementById('histBtn').onclick = () => {
  const arch = loadArchive();
  document.getElementById('histList').innerHTML = arch.length
    ? arch.map(c => `<div style="padding:8px 0; border-bottom:1px solid #eef1f6;">
        <strong>${esc(c.title)}</strong>
        <div style="font-size:.8rem; color:#8a95a5;">done ${c.doneAt?new Date(c.doneAt).toLocaleDateString():'—'} · archived ${new Date(c.archivedAt).toLocaleDateString()}</div>
      </div>`).join('')
    : '<p style="color:#9ca3af;">No archived cards yet.</p>';
  histBackdrop.classList.add('show');
};
document.getElementById('histClose').onclick = () => histBackdrop.classList.remove('show');
histBackdrop.addEventListener('click', e => { if (e.target === histBackdrop) histBackdrop.classList.remove('show'); });

// Hook counter into render
const _render = render;
render = function(){ _render(); updateDoneToday(); };
render();
</script>
</body>
</html>
