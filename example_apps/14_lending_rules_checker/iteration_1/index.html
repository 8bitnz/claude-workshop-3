<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lending Rules Checker</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; padding:28px 20px 60px; }
  .wrap { max-width:1000px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  .sub { color:#94a3b8; margin:0 0 24px; font-size:.95rem; }
  h2 { margin:0 0 14px; font-size:1.05rem; color:#e2e8f0; }
  .card { background:#1e293b; border-radius:16px; padding:22px 24px; box-shadow:0 12px 40px rgba(0,0,0,.35); margin-bottom:20px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  @media (max-width:820px) { .grid2 { grid-template-columns:1fr; } }

  label { display:block; font-size:.78rem; color:#94a3b8; margin:12px 0 4px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  input, select { width:100%; padding:10px 11px; border-radius:9px; border:1.5px solid #334155; background:#0f172a; color:#e2e8f0; font-size:.95rem; font-family:inherit; }
  input:focus, select:focus { outline:none; border-color:#6366f1; }

  button { border:none; border-radius:9px; padding:10px 15px; font-size:.9rem; font-weight:700; cursor:pointer; font-family:inherit; }
  button:hover { filter:brightness(1.1); }
  button:active { transform:translateY(1px); }
  .btn-primary { background:#6366f1; color:#fff; }
  .btn-ghost { background:#334155; color:#e2e8f0; }
  .btn-danger { background:#3b1319; color:#fca5a5; }
  .btn-sm { padding:6px 10px; font-size:.78rem; }

  .rulesetbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
  .rulesetbar select { width:auto; min-width:220px; flex:1; }

  .rule-row { display:grid; grid-template-columns:1.6fr 1.3fr .9fr .8fr auto; gap:8px; align-items:end; padding:12px 0; border-bottom:1px solid #263348; }
  .rule-row:last-of-type { border-bottom:none; }
  .rule-row label { margin:0 0 4px; }
  .field { display:flex; flex-direction:column; }
  .del-rule { background:none; color:#f87171; font-size:1.1rem; padding:8px; align-self:end; }

  .add-rule { margin-top:14px; }

  .evaluate-bar { display:flex; justify-content:flex-end; margin-top:6px; }
  .evaluate-bar button { padding:12px 26px; font-size:1rem; }

  .verdict { border-radius:14px; padding:18px 20px; margin-bottom:18px; font-weight:800; font-size:1.15rem; display:flex; align-items:center; gap:10px; }
  .verdict.pass { background:#052e16; color:#4ade80; border:1.5px solid #16653477; }
  .verdict.fail { background:#3b0d0d; color:#f87171; border:1.5px solid #7f1d1d77; }
  .verdict .detail { display:block; font-weight:500; font-size:.85rem; color:#cbd5e1; margin-top:4px; }

  .result-row { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:13px 14px; border-radius:10px; margin-bottom:8px; background:#0f172a; border:1.5px solid #263348; }
  .result-row.pass { border-color:#14532d; }
  .result-row.fail { border-color:#7f1d1d; }
  .r-label { font-weight:700; font-size:.92rem; }
  .r-detail { color:#94a3b8; font-size:.82rem; margin-top:2px; }
  .badge { flex-shrink:0; font-size:.75rem; font-weight:800; padding:5px 11px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; }
  .badge.pass { background:#052e16; color:#4ade80; }
  .badge.fail { background:#3b0d0d; color:#f87171; }

  .empty { color:#64748b; font-size:.88rem; padding:14px 0; text-align:center; }
  .hint { color:#64748b; font-size:.78rem; margin-top:2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 Lending Rules Checker</h1>
  <p class="sub">Define a lender's or product's eligibility rules, enter an applicant's numbers, and get an instant pass/fail verdict.</p>

  <div class="card">
    <div class="rulesetbar">
      <select id="rulesetSelect"></select>
      <button class="btn-ghost btn-sm" id="newRuleset">+ New rule set</button>
      <button class="btn-ghost btn-sm" id="duplicateRuleset">Duplicate</button>
      <button class="btn-ghost btn-sm" id="renameRuleset">Rename</button>
      <button class="btn-danger btn-sm" id="deleteRuleset">Delete</button>
    </div>

    <h2 id="rulesTitle">Eligibility Rules</h2>
    <div id="rulesList"></div>
    <div class="add-rule"><button class="btn-ghost" id="addRule">+ Add rule</button></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>Applicant Details</h2>
      <div class="field">
        <label for="annualIncome">Annual income ($)</label>
        <input id="annualIncome" type="number" min="0" step="1000">
      </div>
      <div class="field">
        <label for="monthlyDebts">Total monthly debt payments ($)</label>
        <input id="monthlyDebts" type="number" min="0" step="10">
      </div>
      <div class="field">
        <label for="propertyValue">Property value ($)</label>
        <input id="propertyValue" type="number" min="0" step="1000">
      </div>
      <div class="field">
        <label for="depositAmount">Deposit amount ($)</label>
        <input id="depositAmount" type="number" min="0" step="1000">
      </div>
      <div class="field">
        <label for="creditScore">Credit score</label>
        <input id="creditScore" type="number" min="0" step="1">
      </div>
      <p class="hint" id="loanAmountHint"></p>
      <div class="evaluate-bar"><button class="btn-primary" id="evaluateBtn">Evaluate eligibility</button></div>
    </div>

    <div class="card">
      <h2>Evaluation Results</h2>
      <div id="results"><div class="empty">Fill in applicant details and click "Evaluate eligibility."</div></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'lendingRulesChecker.v1';
const esc = s => (''+s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);

const METRICS = {
  dti:          { label: 'Debt-to-income ratio', unit: '%',  compute: a => a.annualIncome > 0 ? (a.monthlyDebts * 12 / a.annualIncome) * 100 : 0 },
  depositPct:   { label: 'Deposit (% of property value)', unit: '%', compute: a => a.propertyValue > 0 ? (a.depositAmount / a.propertyValue) * 100 : 0 },
  lvr:          { label: 'Loan-to-value ratio', unit: '%',   compute: a => a.propertyValue > 0 ? ((a.propertyValue - a.depositAmount) / a.propertyValue) * 100 : 0 },
  creditScore:  { label: 'Credit score', unit: '',           compute: a => a.creditScore },
  annualIncome: { label: 'Annual income', unit: '$',         compute: a => a.annualIncome },
  monthlyDebts: { label: 'Monthly debt payments', unit: '$', compute: a => a.monthlyDebts },
  loanAmount:   { label: 'Loan amount', unit: '$',           compute: a => Math.max(0, a.propertyValue - a.depositAmount) },
};

const COMPARISONS = {
  min:    { label: 'At least (min)', symbol: '≥', test: (v, t) => v >= t },
  max:    { label: 'At most (max)',  symbol: '≤', test: (v, t) => v <= t },
  equals: { label: 'Equals',         symbol: '=',       test: (v, t) => Math.round(v * 100) === Math.round(t * 100) },
};

function defaultRule(metric, comparison, threshold, label) {
  return { id: uid(), label, metric, comparison, threshold };
}

function defaultState() {
  return {
    activeId: 'standard',
    ruleSets: {
      standard: {
        name: 'Lender A — Standard',
        rules: [
          defaultRule('dti', 'max', 40, 'Maximum debt-to-income ratio'),
          defaultRule('depositPct', 'min', 20, 'Minimum deposit %'),
          defaultRule('creditScore', 'min', 650, 'Minimum credit score'),
          defaultRule('lvr', 'max', 80, 'Maximum loan-to-value ratio'),
        ],
      },
      lowdeposit: {
        name: 'Lender B — Low Deposit',
        rules: [
          defaultRule('dti', 'max', 45, 'Maximum debt-to-income ratio'),
          defaultRule('depositPct', 'min', 5, 'Minimum deposit %'),
          defaultRule('creditScore', 'min', 620, 'Minimum credit score'),
          defaultRule('lvr', 'max', 95, 'Maximum loan-to-value ratio'),
        ],
      },
    },
    applicant: {
      annualIncome: 95000,
      monthlyDebts: 450,
      propertyValue: 500000,
      depositAmount: 60000,
      creditScore: 690,
    },
  };
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.ruleSets && s.applicant) return s;
  } catch {}
  return defaultState();
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

let state = load();

function activeRuleset() { return state.ruleSets[state.activeId]; }

function fmtVal(metricKey, v) {
  const m = METRICS[metricKey];
  if (m.unit === '%') return v.toFixed(1) + '%';
  if (m.unit === '$') return '$' + Math.round(v).toLocaleString();
  return Math.round(v).toString();
}

function renderRulesetSelect() {
  const sel = $('rulesetSelect');
  sel.innerHTML = Object.entries(state.ruleSets)
    .map(([id, rs]) => `<option value="${id}" ${id === state.activeId ? 'selected' : ''}>${esc(rs.name)}</option>`)
    .join('');
}

function renderRules() {
  const rs = activeRuleset();
  $('rulesTitle').textContent = `Eligibility Rules — ${rs.name}`;
  if (!rs.rules.length) {
    $('rulesList').innerHTML = '<div class="empty">No rules yet. Add one below.</div>';
    return;
  }
  $('rulesList').innerHTML = rs.rules.map(r => `
    <div class="rule-row" data-id="${r.id}">
      <div class="field">
        <label>Rule label</label>
        <input class="r-label-input" data-field="label" value="${esc(r.label)}">
      </div>
      <div class="field">
        <label>Metric</label>
        <select data-field="metric">
          ${Object.entries(METRICS).map(([k, m]) => `<option value="${k}" ${k === r.metric ? 'selected' : ''}>${esc(m.label)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Comparison</label>
        <select data-field="comparison">
          ${Object.entries(COMPARISONS).map(([k, c]) => `<option value="${k}" ${k === r.comparison ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Threshold</label>
        <input type="number" step="any" data-field="threshold" value="${r.threshold}">
      </div>
      <button class="del-rule" data-action="delete-rule" title="Remove rule">✕</button>
    </div>
  `).join('');

  $('rulesList').querySelectorAll('.rule-row').forEach(row => {
    const id = row.dataset.id;
    const rule = rs.rules.find(r => r.id === id);
    row.querySelectorAll('[data-field]').forEach(el => {
      el.addEventListener('input', () => {
        const field = el.dataset.field;
        rule[field] = field === 'threshold' ? (parseFloat(el.value) || 0) : el.value;
        save();
      });
    });
    row.querySelector('[data-action="delete-rule"]').addEventListener('click', () => {
      rs.rules = rs.rules.filter(r => r.id !== id);
      save(); renderRules();
    });
  });
}

function readApplicant() {
  const a = {
    annualIncome: parseFloat($('annualIncome').value) || 0,
    monthlyDebts: parseFloat($('monthlyDebts').value) || 0,
    propertyValue: parseFloat($('propertyValue').value) || 0,
    depositAmount: parseFloat($('depositAmount').value) || 0,
    creditScore: parseFloat($('creditScore').value) || 0,
  };
  return a;
}

function renderApplicantForm() {
  const a = state.applicant;
  $('annualIncome').value = a.annualIncome;
  $('monthlyDebts').value = a.monthlyDebts;
  $('propertyValue').value = a.propertyValue;
  $('depositAmount').value = a.depositAmount;
  $('creditScore').value = a.creditScore;
  updateLoanHint();
}

function updateLoanHint() {
  const a = readApplicant();
  const loan = Math.max(0, a.propertyValue - a.depositAmount);
  $('loanAmountHint').textContent = `Implied loan amount: $${Math.round(loan).toLocaleString()} (property value − deposit)`;
}

['annualIncome', 'monthlyDebts', 'propertyValue', 'depositAmount', 'creditScore'].forEach(id => {
  $(id).addEventListener('input', () => {
    state.applicant = readApplicant();
    save();
    updateLoanHint();
  });
});

function evaluate() {
  const a = state.applicant;
  const rs = activeRuleset();
  if (!rs.rules.length) {
    $('results').innerHTML = '<div class="empty">This rule set has no rules to evaluate.</div>';
    return;
  }
  const evaluated = rs.rules.map(r => {
    const metric = METRICS[r.metric];
    const cmp = COMPARISONS[r.comparison];
    const value = metric.compute(a);
    const ok = cmp.test(value, r.threshold);
    return { rule: r, metric, cmp, value, ok };
  });
  const failed = evaluated.filter(e => !e.ok);
  const passCount = evaluated.length - failed.length;

  let verdictHtml;
  if (failed.length === 0) {
    verdictHtml = `<div class="verdict pass">✅ Eligible
      <span class="detail" style="margin-left:auto;">${passCount}/${evaluated.length} rules passed</span></div>`;
  } else {
    verdictHtml = `<div class="verdict fail">❌ Not eligible — ${failed.length} rule${failed.length > 1 ? 's' : ''} failed
      <span class="detail">Failed: ${failed.map(f => esc(f.rule.label)).join(', ')}</span></div>`;
  }

  const rowsHtml = evaluated.map(e => `
    <div class="result-row ${e.ok ? 'pass' : 'fail'}">
      <div>
        <div class="r-label">${esc(e.rule.label)}</div>
        <div class="r-detail">${esc(e.metric.label)}: applicant ${fmtVal(e.rule.metric, e.value)} vs required ${e.cmp.symbol} ${fmtVal(e.rule.metric, e.rule.threshold)}</div>
      </div>
      <span class="badge ${e.ok ? 'pass' : 'fail'}">${e.ok ? 'Pass' : 'Fail'}</span>
    </div>
  `).join('');

  $('results').innerHTML = verdictHtml + rowsHtml;
}

// --- ruleset management ---
$('rulesetSelect').addEventListener('change', e => {
  state.activeId = e.target.value;
  save(); renderRules();
  $('results').innerHTML = '<div class="empty">Fill in applicant details and click "Evaluate eligibility."</div>';
});

$('newRuleset').addEventListener('click', () => {
  const name = prompt('Name for the new rule set (e.g. "Lender C — Standard"):');
  if (!name) return;
  const id = uid();
  state.ruleSets[id] = { name, rules: [] };
  state.activeId = id;
  save(); renderRulesetSelect(); renderRules();
});

$('duplicateRuleset').addEventListener('click', () => {
  const rs = activeRuleset();
  const name = prompt('Name for the duplicated rule set:', rs.name + ' (copy)');
  if (!name) return;
  const id = uid();
  state.ruleSets[id] = { name, rules: rs.rules.map(r => ({ ...r, id: uid() })) };
  state.activeId = id;
  save(); renderRulesetSelect(); renderRules();
});

$('renameRuleset').addEventListener('click', () => {
  const rs = activeRuleset();
  const name = prompt('Rename rule set:', rs.name);
  if (!name) return;
  rs.name = name;
  save(); renderRulesetSelect(); renderRules();
});

$('deleteRuleset').addEventListener('click', () => {
  const ids = Object.keys(state.ruleSets);
  if (ids.length <= 1) { alert('At least one rule set must remain.'); return; }
  if (!confirm(`Delete rule set "${activeRuleset().name}"? This cannot be undone.`)) return;
  delete state.ruleSets[state.activeId];
  state.activeId = Object.keys(state.ruleSets)[0];
  save(); renderRulesetSelect(); renderRules();
});

$('addRule').addEventListener('click', () => {
  activeRuleset().rules.push(defaultRule('dti', 'max', 40, 'New rule'));
  save(); renderRules();
});

$('evaluateBtn').addEventListener('click', evaluate);

// --- init ---
renderRulesetSelect();
renderRules();
renderApplicantForm();
</script>
</body>
</html>
