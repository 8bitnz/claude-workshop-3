<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#0d1117; color:#c9d1d9; padding:24px; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  .sub { color:#8b949e; margin:0 0 22px; }
  .add-row { display:flex; gap:8px; max-width:420px; margin-bottom:26px; }
  .add-row input { flex:1; padding:9px 11px; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:#c9d1d9; font:inherit; }
  .add-row button { background:#238636; color:#fff; border:none; border-radius:8px; padding:9px 16px; font-weight:700; cursor:pointer; }
  .habit { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:16px; margin-bottom:16px; }
  .habit-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; }
  .habit-head .name { font-weight:700; font-size:1.05rem; }
  .habit-head .streak { color:#f0883e; font-weight:700; font-size:.9rem; }
  .habit-head .del { background:none; border:none; color:#8b949e; cursor:pointer; font-size:1rem; }
  .grid { display:grid; grid-template-rows:repeat(7, 13px); grid-auto-flow:column; grid-auto-columns:13px; gap:3px; overflow-x:auto; padding-bottom:4px; }
  .cell { width:13px; height:13px; border-radius:3px; background:#21262d; cursor:pointer; transition:background .1s; }
  .cell.l1 { background:#0e4429; } .cell.l2 { background:#006d32; }
  .cell.l3 { background:#26a641; } .cell.l4 { background:#39d353; } .cell.l5 { background:#57ff6b; }
  .cell:hover { outline:1px solid #58a6ff; }
  .empty { color:#8b949e; }
  .stat { color:#8b949e; font-size:.85rem; }
  .legend { display:flex; align-items:center; gap:4px; font-size:.72rem; color:#8b949e; margin-top:8px; }
  .legend .cell { cursor:default; }
  .hint { color:#8b949e; font-size:.78rem; margin-top:6px; }
  .summary { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:16px; margin-bottom:20px; display:flex; gap:24px; flex-wrap:wrap; }
  .summary .item .label { color:#8b949e; font-size:.78rem; text-transform:uppercase; letter-spacing:.5px; }
  .summary .item .value { font-size:1.15rem; font-weight:700; margin-top:2px; }
</style>
</head>
<body>
<h1>🌱 Habit Tracker</h1>
<p class="sub">Build streaks. Click a square repeatedly to set effort (1–5); click past 5 to clear.</p>

<div class="add-row">
  <input id="habitName" placeholder="New habit (e.g. Read, Exercise)…" maxlength="40">
  <button id="addBtn">Add habit</button>
  <button id="exportBtn" style="background:#1f6feb;">⬇ CSV</button>
</div>

<div id="summary"></div>
<div id="habits"></div>

<script>
const KEY = 'habits.v1';
const DAYS = 90;
const MAX_HABITS = 5;
let habits = load();

function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(habits)); }
const esc = s => (''+s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now()+''+Math.random().toString(36).slice(2,6);

function dayKey(offset) { // offset 0 = today, going back
  const d = new Date(); d.setDate(d.getDate() - offset);
  return d.toISOString().slice(0,10);
}
function lastNDays(n) { // oldest first
  const arr = []; for (let i = n-1; i >= 0; i--) arr.push(dayKey(i)); return arr;
}

function streak(days) {
  // consecutive filled days ending today or yesterday
  let s = 0;
  for (let i = 0; i < DAYS; i++) {
    const k = dayKey(i);
    if (days[k]) s++;
    else if (i === 0) continue; // today not done yet is OK, keep counting from yesterday
    else break;
  }
  return s;
}

function pct30(days) {
  let done = 0;
  for (let i = 0; i < 30; i++) if (days[dayKey(i)]) done++;
  return Math.round(done/30*100);
}

document.getElementById('addBtn').onclick = addHabit;
document.getElementById('habitName').addEventListener('keydown', e => { if (e.key==='Enter') addHabit(); });
function addHabit() {
  const name = document.getElementById('habitName').value.trim();
  if (!name) return;
  if (habits.length >= MAX_HABITS) { alert('Up to 5 habits.'); return; }
  habits.push({ id: uid(), name, days: {} });
  document.getElementById('habitName').value = '';
  save(); render();
}
function removeHabit(id){ habits = habits.filter(h=>h.id!==id); save(); render(); }
function toggle(id, key) {
  // Cycle effort 0 -> 1 -> ... -> 5 -> 0
  const h = habits.find(x=>x.id===id); if(!h) return;
  const cur = h.days[key] || 0;
  const next = (cur + 1) % 6;
  if (next === 0) delete h.days[key]; else h.days[key] = next;
  save(); render();
}

function render() {
  const cont = document.getElementById('habits');
  if (!habits.length) { cont.innerHTML = '<p class="empty">No habits yet. Add one above to start tracking.</p>'; return; }
  cont.innerHTML = habits.map(h => {
    const cells = lastNDays(DAYS).map(k => {
      const lvl = h.days[k] || 0;
      return `<div class="cell ${lvl?('l'+lvl):''}" data-id="${h.id}" data-key="${k}" title="${k}${lvl?(' · effort '+lvl):''}"></div>`;
    }).join('');
    return `<div class="habit">
      <div class="habit-head">
        <span class="name">${esc(h.name)} <span class="stat">· ${pct30(h.days)}% last 30 days</span></span>
        <span style="display:flex; align-items:center; gap:12px;">
          <span class="streak">🔥 ${streak(h.days)} day streak</span>
          <button class="del" onclick="removeHabit('${h.id}')" title="Remove">✕</button>
        </span>
      </div>
      <div class="grid">${cells}</div>
      <div class="legend">Effort: less
        <span class="cell"></span><span class="cell l1"></span><span class="cell l2"></span>
        <span class="cell l3"></span><span class="cell l4"></span><span class="cell l5"></span> more</div>
    </div>`;
  }).join('');
  cont.querySelectorAll('.cell').forEach(c =>
    c.addEventListener('click', () => toggle(c.dataset.id, c.dataset.key)));
  renderSummary();
}

function renderSummary() {
  const el = document.getElementById('summary');
  if (!habits.length) { el.innerHTML = ''; return; }
  // longest current streak
  let best = { name: '—', s: -1 };
  habits.forEach(h => { const s = streak(h.days); if (s > best.s) best = { name: h.name, s }; });
  // most missed this week (last 7 days, not done)
  const week = lastNDays(7);
  let worst = { name: '—', missed: -1 };
  habits.forEach(h => {
    const missed = week.filter(k => !h.days[k]).length;
    if (missed > worst.missed) worst = { name: h.name, missed };
  });
  el.innerHTML = `<div class="summary">
    <div class="item"><div class="label">Longest current streak</div>
      <div class="value">🔥 ${esc(best.name)} — ${best.s} day${best.s===1?'':'s'}</div></div>
    <div class="item"><div class="label">Most missed this week</div>
      <div class="value">😴 ${esc(worst.name)} — ${worst.missed}/7 missed</div></div>
  </div>`;
}

// ---- CSV export ----
document.getElementById('exportBtn').onclick = () => {
  if (!habits.length) { alert('No habits to export.'); return; }
  const days = lastNDays(DAYS);
  const header = ['date', ...habits.map(h => '"'+h.name.replace(/"/g,'""')+'"')].join(',');
  const rows = days.map(d => [d, ...habits.map(h => h.days[d] || 0)].join(','));
  const csv = [header, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'habits_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

render();
</script>
</body>
</html>
