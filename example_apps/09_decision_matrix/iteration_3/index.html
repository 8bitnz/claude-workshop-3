<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Matrix</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:#f6f7fb; color:#1f2733; padding:24px; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  .sub { color:#6b7280; margin:0 0 20px; }
  .toolbar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  button { background:#4f46e5; color:#fff; border:none; border-radius:8px; padding:9px 14px; font-weight:600; cursor:pointer; }
  button.ghost { background:#e8e8f5; color:#4f46e5; }
  button:hover { filter:brightness(1.05); }
  .table-wrap { overflow-x:auto; background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.06); padding:12px; }
  table { border-collapse:collapse; width:100%; min-width:520px; }
  th, td { border:1px solid #eceef4; padding:8px; text-align:center; }
  th.opt, td.opt { text-align:left; }
  thead th { background:#f4f4fb; }
  .crit-name { border:none; font-weight:700; width:110px; text-align:center; font:inherit; background:transparent; }
  .weight { width:52px; padding:4px; border:1px solid #d8dbe6; border-radius:6px; text-align:center; }
  .wlabel { font-size:.7rem; color:#8a90a2; display:block; margin-top:2px; }
  .opt-name { border:none; font-weight:600; width:150px; font:inherit; background:transparent; }
  .score { width:52px; padding:5px; border:1px solid #d8dbe6; border-radius:6px; text-align:center; font:inherit; }
  .total { font-weight:800; font-size:1.05rem; }
  tr.winner td { background:#ecfdf5; }
  tr.winner .total { color:#059669; }
  .del { background:none; color:#c0392b; border:none; cursor:pointer; font-size:1rem; }
  .addcrit { width:52px; }
  .chart { background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.06); padding:18px; margin-top:20px; }
  .chart h2 { margin:0 0 14px; font-size:1.05rem; }
  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar-label { width:150px; font-weight:600; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track { flex:1; background:#f0f1f7; border-radius:6px; overflow:hidden; height:26px; }
  .bar-fill { height:100%; background:linear-gradient(90deg,#6366f1,#4f46e5); border-radius:6px; transition:width .4s ease; min-width:2px; }
  .bar-fill.win { background:linear-gradient(90deg,#34d399,#059669); }
  .bar-val { width:44px; font-weight:700; }
</style>
</head>
<body>
<h1>⚖️ Decision Matrix</h1>
<p class="sub">Score each option against weighted criteria. The winner is highlighted.</p>

<div class="toolbar">
  <select id="matrixPicker" class="ghost" style="padding:9px; border-radius:8px;"></select>
  <button id="saveAs">💾 Save as…</button>
  <button class="ghost" id="deleteMatrix">🗑 Delete</button>
  <span style="flex-basis:100%; height:0;"></span>
  <button id="addOption">+ Option (row)</button>
  <button id="addCriterion">+ Criterion (column)</button>
  <button class="ghost" id="reset">Reset</button>
</div>

<div class="table-wrap">
  <table id="matrix"></table>
</div>

<div class="chart">
  <h2>📊 Weighted totals</h2>
  <div id="chart"></div>
</div>

<script>
const STORE_KEY = 'decisionMatrix.store';
const DEFAULT_MATRIX = () => ({
  criteria: [{ name: 'Cost', weight: 5 }, { name: 'Quality', weight: 4 }, { name: 'Speed', weight: 3 }],
  options: [
    { name: 'Option A', scores: [3, 4, 2] },
    { name: 'Option B', scores: [4, 3, 5] },
  ],
});

let store = loadStore();
let currentName = store.current;
let state = store.matrices[currentName];

function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && s.matrices && s.current && s.matrices[s.current]) return s;
  } catch {}
  return { current: 'My decision', matrices: { 'My decision': DEFAULT_MATRIX() } };
}
function save() {
  store.matrices[currentName] = state;
  store.current = currentName;
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}
const esc = s => (''+s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function totalFor(opt) {
  return opt.scores.reduce((sum, sc, i) => sum + (sc || 0) * (state.criteria[i]?.weight || 0), 0);
}

function render() {
  const totals = state.options.map(totalFor);
  const max = Math.max(...totals, -Infinity);

  let head = '<thead><tr><th class="opt">Option</th>';
  state.criteria.forEach((c, ci) => {
    head += `<th>
      <input class="crit-name" data-ci="${ci}" value="${esc(c.name)}">
      <div><input class="weight" type="number" min="1" max="5" data-ci="${ci}" value="${c.weight}">
      <span class="wlabel">weight</span></div>
      <button class="del" data-delcrit="${ci}" title="Remove criterion">✕</button>
    </th>`;
  });
  head += '<th>Total</th></tr></thead>';

  let body = '<tbody>';
  state.options.forEach((o, oi) => {
    const isWinner = totals[oi] === max && state.options.length > 0 && max > -Infinity;
    body += `<tr class="${isWinner ? 'winner' : ''}">
      <td class="opt"><input class="opt-name" data-oi="${oi}" value="${esc(o.name)}">
        <button class="del" data-delopt="${oi}" title="Remove option">✕</button></td>`;
    state.criteria.forEach((c, ci) => {
      body += `<td><input class="score" type="number" min="1" max="5" data-oi="${oi}" data-ci="${ci}" value="${o.scores[ci] ?? ''}"></td>`;
    });
    body += `<td class="total">${totals[oi].toFixed(0)}</td></tr>`;
  });
  body += '</tbody>';

  document.getElementById('matrix').innerHTML = head + body;
  renderChart(totals, max);
  wire();
}

function renderChart(totals, max) {
  const el = document.getElementById('chart');
  if (!state.options.length) { el.innerHTML = '<p style="color:#9ca3af;">Add an option to see the chart.</p>'; return; }
  const scale = max > 0 ? max : 1;
  el.innerHTML = state.options.map((o, i) => {
    const w = (totals[i] / scale) * 100;
    const win = totals[i] === max && max > 0;
    return `<div class="bar-row">
      <div class="bar-label">${esc(o.name)}</div>
      <div class="bar-track"><div class="bar-fill ${win?'win':''}" style="width:${w}%"></div></div>
      <div class="bar-val">${totals[i].toFixed(0)}</div>
    </div>`;
  }).join('');
}

function wire() {
  document.querySelectorAll('.crit-name').forEach(el => el.oninput = () => { state.criteria[+el.dataset.ci].name = el.value; save(); });
  document.querySelectorAll('.weight').forEach(el => el.oninput = () => { state.criteria[+el.dataset.ci].weight = clamp(el.value); save(); render(); });
  document.querySelectorAll('.opt-name').forEach(el => el.oninput = () => { state.options[+el.dataset.oi].name = el.value; save(); });
  document.querySelectorAll('.score').forEach(el => el.oninput = () => {
    state.options[+el.dataset.oi].scores[+el.dataset.ci] = clamp(el.value);
    save(); render();
  });
  document.querySelectorAll('[data-delcrit]').forEach(el => el.onclick = () => {
    const ci = +el.dataset.delcrit;
    state.criteria.splice(ci, 1);
    state.options.forEach(o => o.scores.splice(ci, 1));
    save(); render();
  });
  document.querySelectorAll('[data-delopt]').forEach(el => el.onclick = () => {
    state.options.splice(+el.dataset.delopt, 1); save(); render();
  });
}
function clamp(v) { v = parseInt(v) || 0; return Math.max(0, Math.min(5, v)); }

document.getElementById('addOption').onclick = () => {
  state.options.push({ name: 'New option', scores: state.criteria.map(() => 3) });
  save(); render();
};
document.getElementById('addCriterion').onclick = () => {
  state.criteria.push({ name: 'New criterion', weight: 3 });
  state.options.forEach(o => o.scores.push(3));
  save(); render();
};
document.getElementById('reset').onclick = () => {
  if (confirm('Reset this matrix to a blank starting point?')) {
    state = DEFAULT_MATRIX(); save(); render();
  }
};

// ---- Named matrices ----
function renderPicker() {
  const sel = document.getElementById('matrixPicker');
  sel.innerHTML = Object.keys(store.matrices).sort()
    .map(n => `<option ${n===currentName?'selected':''}>${esc(n)}</option>`).join('');
}
document.getElementById('matrixPicker').onchange = e => {
  currentName = e.target.value;
  state = store.matrices[currentName];
  save(); render();
};
document.getElementById('saveAs').onclick = () => {
  const name = prompt('Name this decision (e.g. "Apartment search"):', '');
  if (!name) return;
  // Save a copy of the current matrix under the new name.
  store.matrices[name] = JSON.parse(JSON.stringify(state));
  currentName = name;
  state = store.matrices[name];
  save(); render();
};
document.getElementById('deleteMatrix').onclick = () => {
  const names = Object.keys(store.matrices);
  if (names.length <= 1) { alert('Keep at least one matrix.'); return; }
  if (!confirm(`Delete "${currentName}"?`)) return;
  delete store.matrices[currentName];
  currentName = Object.keys(store.matrices).sort()[0];
  state = store.matrices[currentName];
  save(); render();
};

const _render = render;
render = function(){ _render(); renderPicker(); };
render();
</script>
</body>
</html>
