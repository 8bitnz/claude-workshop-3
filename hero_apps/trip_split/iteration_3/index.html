<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Split</title>
<style>
  :root {
    --bg:#f4f6fb; --ink:#1f2733; --card:#ffffff; --muted:#8a95a5;
    --border:#dde3ec; --soft:#eef2fb; --accent:#2563eb; --shadow:0 2px 10px rgba(0,0,0,0.06);
    --owed:#0e9f6e; --owes:#c0392b;
  }
  :root[data-theme="dark"] {
    --bg:#0f1420; --ink:#e6edf7; --card:#1a2233; --muted:#8494ab;
    --border:#2b3548; --soft:#232d42; --accent:#4f86ff; --shadow:0 2px 14px rgba(0,0,0,0.4);
    --owed:#34d399; --owes:#f87171;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); transition: background .3s, color .3s; }
  header { background:var(--accent); color:#fff; padding:22px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:1.6rem; }
  .theme-toggle { background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:999px; padding:8px 14px; cursor:pointer; font-weight:600; }
  .wrap { max-width:820px; margin:0 auto; padding:20px; display:grid; gap:20px; }
  .card { background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:18px; }
  .card h2 { margin:0 0 12px; font-size:1.05rem; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  label { font-size:.8rem; font-weight:600; color:var(--muted); display:block; margin-bottom:4px; }
  input, select { width:100%; padding:9px 11px; border:1.5px solid var(--border); border-radius:8px; font-size:1rem; background:var(--card); color:var(--ink); }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-weight:700; cursor:pointer; transition: filter .15s, transform .1s; }
  button.ghost { background:var(--soft); color:var(--accent); }
  button.small { padding:6px 12px; font-size:.85rem; }
  button:hover { filter:brightness(1.05); }
  button:active { transform: scale(.97); }
  ul { list-style:none; padding:0; margin:0; }
  .person-chip { display:inline-flex; align-items:center; gap:6px; background:var(--soft); padding:6px 10px; border-radius:999px; margin:4px 4px 0 0; max-width:100%; overflow:hidden; }
  .person-chip span.nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px; }
  .person-chip button { background:none; color:var(--muted); padding:0 2px; font-size:1rem; }
  .split-people { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  .split-row { display:flex; align-items:center; gap:8px; background:var(--soft); padding:6px 10px; border-radius:8px; }
  .split-row label { margin:0; font-weight:500; color:var(--ink); flex:1; display:flex; align-items:center; gap:6px; min-width:0; }
  .split-row label span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .split-row input[type=checkbox] { width:auto; flex:0 0 auto; }
  .split-row input.val { width:90px; flex:0 0 auto; }
  .exp { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); gap:10px; animation: slideIn .25s ease; }
  .exp:last-child { border:none; }
  .exp .desc { font-weight:600; word-break:break-word; }
  .exp .sub { font-size:.85rem; color:var(--muted); }
  .exp .amt { font-weight:700; white-space:nowrap; }
  .exp .icons button { background:none; padding:0 5px; font-size:1rem; }
  .exp .icons .del { color:var(--owes); }
  .exp .icons .edit { color:var(--accent); }
  .cat-tag { display:inline-block; font-size:.72rem; padding:2px 8px; border-radius:999px; background:var(--soft); color:var(--muted); margin-right:6px; }
  .bal { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); gap:8px; }
  .bal span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bal.owed { color:var(--owed); } .bal.owes { color:var(--owes); }
  .settle { padding:8px 0; border-bottom:1px solid var(--border); animation: fade .3s ease; }
  .muted { color:var(--muted); font-size:.9rem; }
  .empty { text-align:center; color:var(--muted); padding:22px 10px; }
  .empty .big { font-size:2rem; display:block; margin-bottom:6px; }
  .mt { margin-top:12px; }
  .seg { display:flex; gap:0; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; }
  .seg button { flex:1; background:var(--card); color:var(--muted); border:none; border-radius:0; padding:8px; font-weight:600; }
  .seg button.active { background:var(--accent); color:#fff; }
  .split-hint { font-size:.8rem; margin-top:6px; }
  .split-hint.ok { color:var(--owed); } .split-hint.bad { color:var(--owes); }
  .catbreak { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
  .barwrap { background:var(--soft); border-radius:6px; height:8px; margin-top:4px; overflow:hidden; }
  .bar { height:100%; background:var(--accent); border-radius:6px; transition: width .4s ease; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:10px; opacity:0; transition:all .3s; z-index:50; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  @keyframes slideIn { from { opacity:0; transform:translateY(-6px);} to {opacity:1; transform:none;} }
  @keyframes fade { from { opacity:0;} to {opacity:1;} }
  @media (max-width:560px) {
    .row { flex-direction:column; }
    header h1 { font-size:1.3rem; }
    .wrap { padding:14px; }
  }
</style>
</head>
<body>
<header>
  <h1>🧳 Trip Split</h1>
  <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
</header>
<div class="wrap">

  <div class="card">
    <h2>People</h2>
    <div class="row">
      <input id="personName" placeholder="Add a person…" maxlength="40">
      <button id="addPerson" style="flex:0 0 auto;">Add</button>
    </div>
    <ul id="peopleList" style="margin-top:4px;"></ul>
  </div>

  <div class="card">
    <h2 id="formTitle">Add an expense</h2>
    <div id="expenseForm"></div>
  </div>

  <div class="card">
    <h2>Expenses</h2>
    <div id="expenseList"><p class="muted">No expenses yet.</p></div>
  </div>

  <div class="card">
    <h2>Balances</h2>
    <div id="balances"><p class="muted">Add people and expenses to see balances.</p></div>
  </div>

  <div class="card">
    <h2>Settle up <button class="ghost small" id="copyBtn" type="button">📋 Copy summary</button></h2>
    <div id="settle"><p class="muted">Nothing to settle yet.</p></div>
  </div>

  <div class="card">
    <h2>Spending by category</h2>
    <div id="catBreakdown"><p class="muted">No spending yet.</p></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ---- Theme ----
const THEME_KEY = 'tripSplit.theme';
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeToggle').textContent = t === 'dark' ? '☀️ Light' : '🌙 Dark';
}
applyTheme(localStorage.getItem(THEME_KEY) || 'light');
document.getElementById('themeToggle').onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, t); applyTheme(t);
};
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

const KEY = 'tripSplit.v1';
const CATEGORIES = {
  Food:'🍔', Transport:'🚕', Lodging:'🏨', Activities:'🎟️', Other:'📦'
};
let state = load();
let editingId = null;   // when editing, holds the expense id

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY)) || {people:[], expenses:[]};
    // migrate old expenses (no split mode / category)
    s.expenses.forEach(e => {
      if (!e.mode) e.mode = 'even';
      if (!e.category) e.category = 'Other';
    });
    return s;
  } catch { return {people:[], expenses:[]}; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
const $ = id => document.getElementById(id);
const esc = s => (''+s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + n.toFixed(2);

// ---- People ----
$('addPerson').onclick = addPerson;
$('personName').addEventListener('keydown', e => { if (e.key === 'Enter') addPerson(); });
function addPerson() {
  const name = $('personName').value.trim();
  if (!name) return;
  if (state.people.some(p => p.toLowerCase() === name.toLowerCase())) { alert('That person is already added.'); return; }
  state.people.push(name);
  $('personName').value = '';
  save(); renderAll();
}
function removePerson(name) {
  if (state.expenses.some(e => e.payer === name || e.split.some(s => s.person === name))) {
    if (!confirm(`${name} is part of existing expenses. Remove anyway?`)) return;
  }
  state.people = state.people.filter(p => p !== name);
  save(); renderAll();
}

// ---- Expense form (build + edit share this) ----
let formMode = 'even';   // even | exact | percent

function renderForm(exp) {
  editingId = exp ? exp.id : null;
  formMode = exp ? exp.mode : 'even';
  $('formTitle').textContent = exp ? 'Edit expense' : 'Add an expense';
  const desc = exp ? exp.desc : '';
  const amount = exp ? exp.amount : '';
  const payer = exp ? exp.payer : (state.people[0] || '');
  const category = exp ? exp.category : 'Food';

  $('expenseForm').innerHTML = `
    <div class="row">
      <div style="flex:2;"><label>Description</label><input id="expDesc" value="${esc(desc)}" placeholder="Dinner, taxi, hotel…"></div>
      <div><label>Amount</label><input id="expAmount" type="number" min="0" step="0.01" value="${amount}" placeholder="0.00"></div>
    </div>
    <div class="row mt">
      <div><label>Paid by</label><select id="expPayer">${state.people.map(p=>`<option ${p===payer?'selected':''}>${esc(p)}</option>`).join('')||'<option value="">Add people first</option>'}</select></div>
      <div><label>Category</label><select id="expCategory">${Object.keys(CATEGORIES).map(c=>`<option ${c===category?'selected':''}>${CATEGORIES[c]} ${c}</option>`).join('')}</select></div>
    </div>
    <div class="mt"><label>Split method</label>
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="even" class="${formMode==='even'?'active':''}">Even</button>
        <button type="button" data-mode="exact" class="${formMode==='exact'?'active':''}">Exact $</button>
        <button type="button" data-mode="percent" class="${formMode==='percent'?'active':''}">Percent %</button>
      </div>
    </div>
    <div class="mt"><label>Split among</label><div class="split-people" id="splitPeople"></div>
      <div class="split-hint" id="splitHint"></div>
    </div>
    <div class="row mt">
      <button id="saveExpense">${exp?'Save changes':'Add expense'}</button>
      ${exp?'<button class="ghost" id="cancelEdit">Cancel</button>':''}
    </div>`;

  $('modeSeg').addEventListener('click', e => {
    const m = e.target.dataset.mode; if (!m) return;
    formMode = m; renderSplitRows(exp);
    [...$('modeSeg').children].forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  });
  $('saveExpense').onclick = saveExpense;
  if ($('cancelEdit')) $('cancelEdit').onclick = () => renderForm(null);
  $('expAmount').addEventListener('input', updateHint);
  renderSplitRows(exp);
}

function renderSplitRows(exp) {
  const cont = $('splitPeople');
  if (!state.people.length) { cont.innerHTML = '<span class="muted">Add people first.</span>'; return; }
  cont.innerHTML = state.people.map(p => {
    const inSplit = exp ? exp.split.find(s => s.person === p) : true;
    const checked = inSplit ? 'checked' : '';
    let valField = '';
    if (formMode === 'exact') valField = `<input class="val" type="number" min="0" step="0.01" data-person="${esc(p)}" value="${inSplit && inSplit.value!=null ? inSplit.value : ''}" placeholder="$">`;
    if (formMode === 'percent') valField = `<input class="val" type="number" min="0" step="0.01" data-person="${esc(p)}" value="${inSplit && inSplit.value!=null ? inSplit.value : ''}" placeholder="%">`;
    return `<div class="split-row">
      <label><input type="checkbox" value="${esc(p)}" ${checked}> ${esc(p)}</label>${valField}
    </div>`;
  }).join('');
  cont.addEventListener('input', updateHint);
  updateHint();
}

function updateHint() {
  const hint = $('splitHint'); if (!hint) return;
  if (formMode === 'even') { hint.textContent = 'Split evenly among the selected people.'; hint.className = 'split-hint'; return; }
  const total = parseFloat($('expAmount').value) || 0;
  const vals = [...document.querySelectorAll('.split-row')]
    .filter(r => r.querySelector('input[type=checkbox]').checked)
    .map(r => parseFloat(r.querySelector('.val').value) || 0);
  const sum = vals.reduce((a,b)=>a+b,0);
  if (formMode === 'exact') {
    const ok = Math.abs(sum - total) < 0.005;
    hint.textContent = `Sum: ${money(sum)} of ${money(total)} ${ok?'✓':'— must equal the total'}`;
    hint.className = 'split-hint ' + (ok?'ok':'bad');
  } else {
    const ok = Math.abs(sum - 100) < 0.05;
    hint.textContent = `Sum: ${sum.toFixed(2)}% ${ok?'✓':'— must equal 100%'}`;
    hint.className = 'split-hint ' + (ok?'ok':'bad');
  }
}

function saveExpense() {
  const desc = $('expDesc').value.trim();
  const amount = parseFloat($('expAmount').value);
  const payer = $('expPayer').value;
  const category = $('expCategory').value.replace(/^[^\s]+\s/, ''); // strip emoji
  if (!desc) return alert('Enter a description.');
  if (!(amount > 0)) return alert('Enter an amount greater than 0.');
  if (!payer) return alert('Choose who paid.');

  const rows = [...document.querySelectorAll('.split-row')].filter(r => r.querySelector('input[type=checkbox]').checked);
  if (rows.length === 0) return alert('Select at least one person.');

  let split;
  if (formMode === 'even') {
    split = rows.map(r => ({ person: r.querySelector('input[type=checkbox]').value }));
  } else {
    split = rows.map(r => ({ person: r.querySelector('input[type=checkbox]').value, value: parseFloat(r.querySelector('.val').value) || 0 }));
    const sum = split.reduce((a,s)=>a+s.value,0);
    if (formMode === 'exact' && Math.abs(sum - amount) >= 0.005) return alert(`Exact amounts must sum to ${money(amount)} (currently ${money(sum)}).`);
    if (formMode === 'percent' && Math.abs(sum - 100) >= 0.05) return alert(`Percentages must sum to 100% (currently ${sum.toFixed(2)}%).`);
  }

  const record = { id: editingId || (Date.now()+''+Math.random().toString(36).slice(2,6)), desc, amount, payer, category, mode: formMode, split };
  if (editingId) {
    const i = state.expenses.findIndex(e => e.id === editingId);
    state.expenses[i] = record;
  } else {
    state.expenses.push(record);
  }
  save(); renderForm(null); renderAll();
}

function editExpense(id) {
  const e = state.expenses.find(x => x.id === id);
  if (e) { renderForm(e); window.scrollTo({top:0, behavior:'smooth'}); }
}
function deleteExpense(id) {
  if (!confirm('Delete this expense?')) return;
  state.expenses = state.expenses.filter(e => e.id !== id);
  if (editingId === id) renderForm(null);
  save(); renderAll();
}

// ---- Math (shares per person for one expense) ----
function sharesFor(e) {
  const shares = {};
  if (e.mode === 'even') {
    const per = e.amount / e.split.length;
    e.split.forEach(s => shares[s.person] = per);
  } else if (e.mode === 'exact') {
    e.split.forEach(s => shares[s.person] = s.value);
  } else { // percent
    e.split.forEach(s => shares[s.person] = e.amount * (s.value / 100));
  }
  return shares;
}

function computeBalances() {
  const net = {};
  state.people.forEach(p => net[p] = 0);
  state.expenses.forEach(e => {
    if (!(e.payer in net)) net[e.payer] = 0;
    net[e.payer] += e.amount;
    const shares = sharesFor(e);
    Object.entries(shares).forEach(([p, v]) => { if (!(p in net)) net[p] = 0; net[p] -= v; });
  });
  Object.keys(net).forEach(p => net[p] = Math.round(net[p] * 100) / 100);
  return net;
}

function settleUp(net) {
  const creditors = [], debtors = [];
  Object.entries(net).forEach(([p, v]) => {
    if (v > 0.005) creditors.push({p, v}); else if (v < -0.005) debtors.push({p, v:-v});
  });
  creditors.sort((a,b)=>b.v-a.v); debtors.sort((a,b)=>b.v-a.v);
  const tx = []; let i=0, j=0;
  while (i < debtors.length && j < creditors.length) {
    const pay = Math.min(debtors[i].v, creditors[j].v);
    tx.push({ from: debtors[i].p, to: creditors[j].p, amount: Math.round(pay*100)/100 });
    debtors[i].v -= pay; creditors[j].v -= pay;
    if (debtors[i].v < 0.005) i++; if (creditors[j].v < 0.005) j++;
  }
  return tx;
}

// ---- Render ----
function renderPeople() {
  $('peopleList').innerHTML = state.people.length
    ? state.people.map(p => `<span class="person-chip"><span class="nm">${esc(p)}</span><button onclick="removePerson('${esc(p).replace(/'/g,"\\'")}')">✕</button></span>`).join('')
    : '<div class="empty"><span class="big">👥</span>Add the people on your trip to get started.</div>';
}
function renderExpenses() {
  $('expenseList').innerHTML = state.expenses.length
    ? state.expenses.slice().reverse().map(e => {
        const modeLabel = e.mode === 'even' ? `split ${e.split.length} way${e.split.length>1?'s':''}` : e.mode === 'exact' ? 'exact amounts' : 'by percent';
        return `<div class="exp">
          <div>
            <div class="desc"><span class="cat-tag">${CATEGORIES[e.category]||'📦'} ${esc(e.category)}</span>${esc(e.desc)}</div>
            <div class="sub">${esc(e.payer)} paid · ${modeLabel}</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="amt">${money(e.amount)}</span>
            <span class="icons"><button class="edit" onclick="editExpense('${e.id}')">✏️</button><button class="del" onclick="deleteExpense('${e.id}')">🗑</button></span>
          </div>
        </div>`;
      }).join('')
    : '<div class="empty"><span class="big">🧾</span>No expenses yet. Log the first one above.</div>';
}
function renderBalances() {
  if (!state.people.length || !state.expenses.length) {
    $('balances').innerHTML = '<p class="muted">Add people and expenses to see balances.</p>';
    $('settle').innerHTML = '<p class="muted">Nothing to settle yet.</p>';
    return;
  }
  const net = computeBalances();
  $('balances').innerHTML = Object.entries(net).map(([p, v]) => {
    const cls = v > 0.005 ? 'owed' : v < -0.005 ? 'owes' : '';
    const txt = v > 0.005 ? `is owed ${money(v)}` : v < -0.005 ? `owes ${money(-v)}` : 'settled up';
    return `<div class="bal ${cls}"><span>${esc(p)}</span><span>${txt}</span></div>`;
  }).join('');
  const tx = settleUp(net);
  $('settle').innerHTML = tx.length
    ? tx.map(t => `<div class="settle"><strong>${esc(t.from)}</strong> pays <strong>${esc(t.to)}</strong> ${money(t.amount)}</div>`).join('')
    : '<p class="muted">Everyone is settled up! 🎉</p>';
}
function renderCatBreakdown() {
  if (!state.expenses.length) { $('catBreakdown').innerHTML = '<p class="muted">No spending yet.</p>'; return; }
  const totals = {}; let grand = 0;
  state.expenses.forEach(e => { totals[e.category] = (totals[e.category]||0) + e.amount; grand += e.amount; });
  $('catBreakdown').innerHTML = Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([c, v]) => {
    const pct = grand ? v/grand*100 : 0;
    return `<div style="padding:6px 0;border-bottom:1px solid var(--border);">
      <div class="catbreak" style="border:none;padding:0;"><span>${CATEGORIES[c]||'📦'} ${esc(c)}</span><span>${money(v)} · ${pct.toFixed(0)}%</span></div>
      <div class="barwrap"><div class="bar" style="width:${pct}%"></div></div>
    </div>`;
  }).join('') + `<div class="catbreak" style="font-weight:700;border:none;"><span>Total</span><span>${money(grand)}</span></div>`;
}
function renderAll() {
  renderPeople(); renderExpenses(); renderBalances(); renderCatBreakdown();
  if (!editingId) renderForm(null);   // refresh people options in the add form
}
// ---- Copy summary ----
$('copyBtn').onclick = async () => {
  if (!state.people.length || !state.expenses.length) { toast('Nothing to copy yet.'); return; }
  const net = computeBalances();
  const tx = settleUp(net);
  const total = state.expenses.reduce((a,e)=>a+e.amount,0);
  let text = `🧳 Trip Split summary\n`;
  text += `Total spent: ${money(total)} across ${state.expenses.length} expense${state.expenses.length>1?'s':''}\n\n`;
  text += `Balances:\n`;
  Object.entries(net).forEach(([p,v]) => {
    text += v > 0.005 ? `  • ${p} is owed ${money(v)}\n`
      : v < -0.005 ? `  • ${p} owes ${money(-v)}\n`
      : `  • ${p} is settled up\n`;
  });
  text += `\nSettle up:\n`;
  text += tx.length ? tx.map(t => `  • ${t.from} pays ${t.to} ${money(t.amount)}`).join('\n') : '  • Everyone is settled up! 🎉';
  try {
    await navigator.clipboard.writeText(text);
    toast('Summary copied to clipboard!');
  } catch {
    // fallback for insecure contexts
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); toast('Summary copied!');
  }
};

renderForm(null);
renderAll();
</script>
</body>
</html>
