<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kudos Wall</title>
<style>
  :root {
    --bg: #fdf6ec;
    --card: #ffffff;
    --ink: #3a2f27;
    --muted: #8a7a6d;
    --accent: #e07a3f;
    --shadow: 0 6px 20px rgba(90, 60, 30, 0.12);
    --teamwork: #3b82f6;
    --creativity: #a855f7;
    --above: #f59e0b;
    --leadership: #10b981;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 10%, #fff3e0, var(--bg));
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 40px 20px 20px;
  }
  header h1 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3.2rem);
    letter-spacing: -1px;
    background: linear-gradient(120deg, #e07a3f, #d1495b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); margin: 8px 0 0; font-size: 1.1rem; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }

  .post-form {
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 24px;
    margin: 20px auto 32px;
    display: grid;
    gap: 14px;
    grid-template-columns: 1fr 1fr;
    max-width: 720px;
  }
  .post-form .full { grid-column: 1 / -1; }
  label { font-size: 0.8rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;}
  input, textarea, select {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid #ece0d3;
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
    background: #fffdfa;
    color: var(--ink);
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #e07a3f; }
  textarea { resize: vertical; min-height: 60px; }
  .count { font-size: 0.75rem; color: var(--muted); text-align: right; }
  button.post-btn {
    grid-column: 1 / -1;
    background: linear-gradient(120deg, #e07a3f, #d1495b);
    color: #fff;
    border: none;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  button.post-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(209,73,91,0.3); }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 22px;
    justify-content: center;
  }
  .filter-bar select { max-width: 260px; }
  .filter-bar .clear { background: none; border: 1.5px solid #ecd9c8; color: var(--muted); padding: 10px 14px; border-radius: 10px; cursor: pointer; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .kcard {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: pop 0.25s ease;
    border-top: 4px solid var(--accent);
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.96) translateY(8px);} to {opacity:1; transform: none;} }
  .tag {
    align-self: flex-start;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 4px 10px;
    border-radius: 999px;
    color: #fff;
  }
  .tag.Teamwork { background: var(--teamwork); }
  .tag.Creativity { background: var(--creativity); }
  .tag[data-cat="Above & Beyond"] { background: var(--above); }
  .tag.Leadership { background: var(--leadership); }
  .kcard .msg { font-size: 1.08rem; line-height: 1.45; }
  .kcard .meta { font-size: 0.9rem; color: var(--muted); margin-top: auto; }
  .kcard .meta strong { color: var(--ink); }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 1.1rem; }

  @media (max-width: 560px) {
    .post-form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>🎉 Kudos Wall</h1>
  <p>Give a teammate a shoutout they deserve.</p>
</header>

<div class="wrap">
  <form class="post-form" id="form">
    <div>
      <label for="from">From</label>
      <input id="from" required placeholder="Your name" maxlength="40">
    </div>
    <div>
      <label for="to">To</label>
      <input id="to" required placeholder="Recipient's name" maxlength="40">
    </div>
    <div class="full">
      <label for="message">Message</label>
      <textarea id="message" required maxlength="140" placeholder="Say something nice…"></textarea>
      <div class="count"><span id="count">0</span>/140</div>
    </div>
    <div class="full">
      <label for="category">Category</label>
      <select id="category">
        <option>Teamwork</option>
        <option>Creativity</option>
        <option>Above &amp; Beyond</option>
        <option>Leadership</option>
      </select>
    </div>
    <button type="submit" class="post-btn">Post Kudos</button>
  </form>

  <div class="filter-bar">
    <label style="margin:0;">Filter by recipient</label>
    <select id="filter"><option value="">Everyone</option></select>
    <button class="clear" id="clearFilter" type="button">Show all</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No kudos yet — be the first to post one! 🌟</div>
</div>

<script>
const STORE_KEY = 'kudosWall.v1';
let kudos = load();

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch { return []; }
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(kudos)); }

const $ = id => document.getElementById(id);
const grid = $('grid'), empty = $('empty'), filterSel = $('filter');

$('message').addEventListener('input', e => $('count').textContent = e.target.value.length);

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const k = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    from: $('from').value.trim(),
    to: $('to').value.trim(),
    message: $('message').value.trim(),
    category: $('category').value,
    created: Date.now()
  };
  if (!k.from || !k.to || !k.message) return;
  kudos.push(k);
  save();
  e.target.reset();
  $('count').textContent = '0';
  render();
});

$('filter').addEventListener('change', render);
$('clearFilter').addEventListener('click', () => { filterSel.value = ''; render(); });

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function refreshFilterOptions() {
  const recipients = [...new Set(kudos.map(k => k.to))].sort((a,b)=>a.localeCompare(b));
  const current = filterSel.value;
  filterSel.innerHTML = '<option value="">Everyone</option>' +
    recipients.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('');
  if (recipients.includes(current)) filterSel.value = current;
}

function render() {
  refreshFilterOptions();
  const f = filterSel.value;
  let list = [...kudos].sort((a,b) => b.created - a.created);
  if (f) list = list.filter(k => k.to === f);

  grid.innerHTML = list.map(k => `
    <div class="kcard" style="border-top-color: var(--${catVar(k.category)})">
      <span class="tag ${cssCat(k.category)}" data-cat="${esc(k.category)}">${esc(k.category)}</span>
      <div class="msg">“${esc(k.message)}”</div>
      <div class="meta">from <strong>${esc(k.from)}</strong> to <strong>${esc(k.to)}</strong></div>
    </div>`).join('');

  empty.hidden = list.length !== 0;
}

function catVar(c) {
  return {'Teamwork':'teamwork','Creativity':'creativity','Above & Beyond':'above','Leadership':'leadership'}[c] || 'accent';
}
function cssCat(c) { return c.replace(/[^a-zA-Z]/g,''); }

render();
</script>
</body>
</html>
