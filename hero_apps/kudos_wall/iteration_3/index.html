<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kudos Wall</title>
<style>
  :root {
    --bg: #fdf6ec;
    --card: #ffffff;
    --ink: #3a2f27;
    --muted: #8a7a6d;
    --accent: #e07a3f;
    --shadow: 0 6px 20px rgba(90, 60, 30, 0.12);
    --teamwork: #3b82f6;
    --creativity: #a855f7;
    --above: #f59e0b;
    --leadership: #10b981;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 10%, #fff3e0, var(--bg));
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 40px 20px 20px;
  }
  header h1 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3.2rem);
    letter-spacing: -1px;
    background: linear-gradient(120deg, #e07a3f, #d1495b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); margin: 8px 0 0; font-size: 1.1rem; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }

  .post-form {
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 24px;
    margin: 20px auto 32px;
    display: grid;
    gap: 14px;
    grid-template-columns: 1fr 1fr;
    max-width: 720px;
  }
  .post-form .full { grid-column: 1 / -1; }
  label { font-size: 0.8rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;}
  input, textarea, select {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid #ece0d3;
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
    background: #fffdfa;
    color: var(--ink);
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #e07a3f; }
  textarea { resize: vertical; min-height: 60px; }
  .count { font-size: 0.75rem; color: var(--muted); text-align: right; }
  button.post-btn {
    grid-column: 1 / -1;
    background: linear-gradient(120deg, #e07a3f, #d1495b);
    color: #fff;
    border: none;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  button.post-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(209,73,91,0.3); }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 22px;
    justify-content: center;
  }
  .filter-bar select { max-width: 260px; }
  .filter-bar .clear { background: none; border: 1.5px solid #ecd9c8; color: var(--muted); padding: 10px 14px; border-radius: 10px; cursor: pointer; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .kcard {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: pop 0.25s ease;
    border-top: 4px solid var(--accent);
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.96) translateY(8px);} to {opacity:1; transform: none;} }
  .tag {
    align-self: flex-start;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 4px 10px;
    border-radius: 999px;
    color: #fff;
  }
  .tag.Teamwork { background: var(--teamwork); }
  .tag.Creativity { background: var(--creativity); }
  .tag[data-cat="Above & Beyond"] { background: var(--above); }
  .tag.Leadership { background: var(--leadership); }
  .kcard .msg { font-size: 1.08rem; line-height: 1.45; }
  .kcard .meta { font-size: 0.9rem; color: var(--muted); margin-top: auto; }
  .kcard .meta strong { color: var(--ink); }
  .reactions { display: flex; gap: 6px; flex-wrap: wrap; }
  .rbtn {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1.5px solid #ece0d3; background: #fffdfa;
    border-radius: 999px; padding: 5px 11px; cursor: pointer;
    font-size: 0.95rem; transition: transform 0.1s, background 0.15s, border-color 0.15s;
  }
  .rbtn:hover { transform: translateY(-1px); }
  .rbtn.active { background: #fff0e4; border-color: #e07a3f; font-weight: 700; }
  .rbtn .rcount { font-size: 0.85rem; color: var(--muted); min-width: 8px; }
  .rbtn.active .rcount { color: #e07a3f; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 1.1rem; }

  .spotlight {
    background: linear-gradient(120deg, #fff7ef, #ffeede);
    border: 2px solid #f4c9a3;
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 28px 30px;
    margin-bottom: 22px;
    position: relative;
  }
  .spotlight .badge {
    position: absolute; top: -14px; left: 24px;
    background: linear-gradient(120deg, #e07a3f, #d1495b);
    color: #fff; font-size: 0.75rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px;
    padding: 6px 14px; border-radius: 999px;
  }
  .spotlight .msg { font-size: 1.5rem; line-height: 1.4; margin: 12px 0 10px; }
  .spotlight .meta { font-size: 1rem; color: var(--muted); }
  .spotlight .meta strong { color: var(--ink); }
  .spotlight .reactsum { margin-top: 10px; font-size: 1.1rem; }

  .leaderboard {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 18px 22px;
    margin-bottom: 26px;
  }
  .leaderboard h2 { margin: 0 0 12px; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .lb-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f2e7da; }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { font-size: 1.3rem; width: 32px; text-align: center; }
  .lb-name { font-weight: 700; flex: 1; }
  .lb-count { color: var(--muted); font-size: 0.95rem; }

  @media (max-width: 560px) {
    .post-form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>🎉 Kudos Wall</h1>
  <p>Give a teammate a shoutout they deserve.</p>
</header>

<div class="wrap">
  <form class="post-form" id="form">
    <div>
      <label for="from">From</label>
      <input id="from" required placeholder="Your name" maxlength="40">
    </div>
    <div>
      <label for="to">To</label>
      <input id="to" required placeholder="Recipient's name" maxlength="40">
    </div>
    <div class="full">
      <label for="message">Message</label>
      <textarea id="message" required maxlength="140" placeholder="Say something nice…"></textarea>
      <div class="count"><span id="count">0</span>/140</div>
    </div>
    <div class="full">
      <label for="category">Category</label>
      <select id="category">
        <option>Teamwork</option>
        <option>Creativity</option>
        <option>Above &amp; Beyond</option>
        <option>Leadership</option>
      </select>
    </div>
    <button type="submit" class="post-btn">Post Kudos</button>
  </form>

  <div id="spotlight"></div>
  <div id="leaderboard"></div>

  <div class="filter-bar">
    <label style="margin:0;">Filter by recipient</label>
    <select id="filter"><option value="">Everyone</option></select>
    <button class="clear" id="clearFilter" type="button">Show all</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No kudos yet — be the first to post one! 🌟</div>
</div>

<script>
const STORE_KEY = 'kudosWall.v1';
const REACTIONS = ['👏','🎉','❤️','🔥'];
// A lightweight per-browser identity so a user can toggle their own reaction.
const ME = (() => {
  let id = localStorage.getItem('kudosWall.me');
  if (!id) { id = 'me-' + Math.random().toString(36).slice(2,10); localStorage.setItem('kudosWall.me', id); }
  return id;
})();
let kudos = load();

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch { return []; }
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(kudos)); }

const $ = id => document.getElementById(id);
const grid = $('grid'), empty = $('empty'), filterSel = $('filter');

$('message').addEventListener('input', e => $('count').textContent = e.target.value.length);

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const k = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    from: $('from').value.trim(),
    to: $('to').value.trim(),
    message: $('message').value.trim(),
    category: $('category').value,
    created: Date.now()
  };
  if (!k.from || !k.to || !k.message) return;
  kudos.push(k);
  save();
  e.target.reset();
  $('count').textContent = '0';
  render();
});

$('filter').addEventListener('change', render);
$('clearFilter').addEventListener('click', () => { filterSel.value = ''; render(); });

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function refreshFilterOptions() {
  const recipients = [...new Set(kudos.map(k => k.to))].sort((a,b)=>a.localeCompare(b));
  const current = filterSel.value;
  filterSel.innerHTML = '<option value="">Everyone</option>' +
    recipients.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('');
  if (recipients.includes(current)) filterSel.value = current;
}

function totalReactions(k) {
  if (!k.reactions) return 0;
  return Object.values(k.reactions).reduce((s, arr) => s + arr.length, 0);
}

function renderSpotlight() {
  const el = document.getElementById('spotlight');
  const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const recent = kudos.filter(k => k.created >= weekAgo);
  if (recent.length === 0) { el.innerHTML = ''; return; }
  // Most reactions in last 7 days; tie-break by most recent.
  const best = recent.slice().sort((a, b) =>
    totalReactions(b) - totalReactions(a) || b.created - a.created)[0];
  const reactSum = REACTIONS
    .map(e => ({ e, n: (best.reactions?.[e] || []).length }))
    .filter(x => x.n > 0)
    .map(x => `${x.e} ${x.n}`).join('  ') || 'No reactions yet';
  el.innerHTML = `
    <div class="spotlight">
      <span class="badge">🌟 Kudos of the Week</span>
      <div class="msg">“${esc(best.message)}”</div>
      <div class="meta">from <strong>${esc(best.from)}</strong> to <strong>${esc(best.to)}</strong>
        · <span class="tag ${cssCat(best.category)}" data-cat="${esc(best.category)}"
          style="display:inline-block;vertical-align:middle;">${esc(best.category)}</span></div>
      <div class="reactsum">${reactSum}</div>
    </div>`;
}

function renderLeaderboard() {
  const el = document.getElementById('leaderboard');
  if (kudos.length === 0) { el.innerHTML = ''; return; }
  const counts = {};
  kudos.forEach(k => counts[k.to] = (counts[k.to] || 0) + 1);
  const top = Object.entries(counts)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .slice(0, 3);
  const medals = ['🥇','🥈','🥉'];
  el.innerHTML = `
    <div class="leaderboard">
      <h2>🏆 Top Recipients (all-time)</h2>
      ${top.map((row, i) => `
        <div class="lb-row">
          <span class="lb-rank">${medals[i]}</span>
          <span class="lb-name">${esc(row[0])}</span>
          <span class="lb-count">${row[1]} kudo${row[1] === 1 ? '' : 's'}</span>
        </div>`).join('')}
    </div>`;
}

function render() {
  renderSpotlight();
  renderLeaderboard();
  refreshFilterOptions();
  const f = filterSel.value;
  let list = [...kudos].sort((a,b) => b.created - a.created);
  if (f) list = list.filter(k => k.to === f);

  grid.innerHTML = list.map(k => `
    <div class="kcard" style="border-top-color: var(--${catVar(k.category)})">
      <span class="tag ${cssCat(k.category)}" data-cat="${esc(k.category)}">${esc(k.category)}</span>
      <div class="msg">“${esc(k.message)}”</div>
      <div class="meta">from <strong>${esc(k.from)}</strong> to <strong>${esc(k.to)}</strong></div>
      <div class="reactions">${reactionButtons(k)}</div>
    </div>`).join('');

  empty.hidden = list.length !== 0;
}

function reactionButtons(k) {
  const r = k.reactions || {};
  return REACTIONS.map(emoji => {
    const users = r[emoji] || [];
    const active = users.includes(ME);
    return `<button class="rbtn ${active ? 'active':''}" onclick="toggleReaction('${k.id}','${emoji}')">
      <span>${emoji}</span><span class="rcount">${users.length || ''}</span></button>`;
  }).join('');
}

// Reactions live inside each kudos object in the SAME localStorage array.
function toggleReaction(id, emoji) {
  const k = kudos.find(x => x.id === id);
  if (!k) return;
  if (!k.reactions) k.reactions = {};
  if (!k.reactions[emoji]) k.reactions[emoji] = [];
  const arr = k.reactions[emoji];
  const i = arr.indexOf(ME);
  if (i === -1) arr.push(ME); else arr.splice(i, 1);
  save();
  render();
}

function catVar(c) {
  return {'Teamwork':'teamwork','Creativity':'creativity','Above & Beyond':'above','Leadership':'leadership'}[c] || 'accent';
}
function cssCat(c) { return c.replace(/[^a-zA-Z]/g,''); }

render();
</script>
</body>
</html>
